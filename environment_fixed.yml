name: mole-py10
channels:
  - conda-forge
  - pytorch
  - pyg
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core ML/Scientific Libraries
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  
  # PyTorch Stack
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda
  
  # PyTorch Lightning
  - pytorch-lightning
  - torchmetrics
  
  # Chemistry and Molecular Processing
  - rdkit=2023.09.1
  - numexpr
  - numcodecs
  
  # Data Processing
  - pyarrow
  - h5py
  - zarr
  
  # Configuration and Utilities
  - omegaconf
  - hydra-core
  - click
  - tqdm
  - joblib
  - psutil
  
  # Jupyter and Development
  - jupyter
  - notebook
  - ipykernel
  - ipywidgets
  
  # Testing and Code Quality
  - pytest
  - pytest-cov
  - flake8
  
  # Documentation
  - sphinx
  - sphinx_rtd_theme
  
  # Other utilities
  - pyyaml
  - packaging
  
  - pip:
    # PyTorch Geometric with specific versions
    - torch-geometric==2.4.0
    - torch-scatter==2.1.2
    - torch-sparse==0.6.18
    - torch-cluster==1.6.3
    - torch-spline-conv==1.2.2
    
    # Development tools (no git dependencies for now)
    - pre-commit
    - black
    - bandit 