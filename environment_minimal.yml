name: mole-py10-minimal
channels:
  - conda-forge
  - pytorch
  - pyg
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core ML/Scientific Libraries
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  
  # PyTorch Stack 
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda
  
  # Essential packages only
  - rdkit=2023.09.1
  - jupyter
  - notebook
  - ipykernel
  - tqdm
  - pyyaml
  
  - pip:
    # Only the most essential pip packages
    - torch-geometric 