name: mole-py10
channels:
  - conda-forge
  - pytorch
  - pyg
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core ML/Scientific Libraries
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  
  # PyTorch Stack (compatible versions for Python 3.9)
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda
  
  # PyTorch Lightning
  - pytorch-lightning
  #  - lightning-fabric
  - torchmetrics
  
  # Chemistry and Molecular Processing
  - rdkit=2023.09.1
  - numexpr
  - numcodecs
  
  # Data Processing
  - pyarrow
  - h5py
  - zarr
  
  # Configuration and Utilities
  - omegaconf
  - hydra-core
  - click
  - tqdm
  - joblib
  - psutil
  
  # Jupyter and Development
  - jupyter
  - notebook
  - ipykernel
  - ipywidgets
  
  # Testing and Code Quality
  - pytest
  - pytest-cov
  - flake8
  
    # Documentation
  - sphinx
  - sphinx_rtd_theme
  
  # Other utilities
  - pyyaml
  - packaging
  
  - pip:
    # PyTorch Geometric (compatible with PyTorch 2.0.1)
    - torch-geometric
    - torch-scatter
    - torch-sparse
    - torch-cluster
    - torch-spline-conv
    
    # DeBERTa (specific commit/version)
    - git+https://github.com/omendezlucio/DeBERTa.git
    
    # ML/AI packages
#    - tensorboardX
#    - wandb
#    - onnx
#    - onnxruntime
    
    # Chemistry and Drug Discovery
#    - PyTDC==0.4.1
#    - fuzzywuzzy
    
    # Text processing
#    - nltk
#    - spacy>=3.6.0,<3.7.0
#    - transformers>=4.30.0,<4.35.0
    
    # Additional utilities
#    - humanfriendly
#    - coloredlogs
#    - docker
#    - gitpython
#    - aiohttp
#    - fsspec
    
    # Development tools
    - pre-commit
    - black
    - bandit 
